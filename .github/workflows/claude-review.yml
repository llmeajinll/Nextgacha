name: Claude Code Review

# PR이 열리거나 새 커밋이 올라오면 Claude가 리뷰 코멘트를 남긴다.
# 필요한 secret: CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`으로 발급) 또는 ANTHROPIC_API_KEY
# 포크에서 온 PR은 secret에 접근할 수 없어 실행되지 않는다 (pull_request_target은 보안상 쓰지 않음).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 같은 PR에 커밋이 연달아 올라오면 이전 리뷰는 취소하고 마지막 것만 실행
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude GitHub App 없이 Actions 기본 토큰으로 코멘트 (작성자는 github-actions)
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 코드 리뷰한다. 코멘트는 한국어로 쓴다.

            ## 먼저 읽을 것
            - `CLAUDE.md`, `.claude/rules/*.md` (FSD 레이어, 스타일링, API route 규칙)
            - 변경된 영역에 해당하는 `docs/policies/*.md` (README.md의 목록 참고)
            - `gh pr view --comments`로 이미 달린 코멘트를 확인하고, 같은 지적은 반복하지 않는다

            ## 볼 것 (중요한 순서)
            1. 버그: 잘못된 동작, 빠진 에러 처리, 경쟁 조건, 상태 전이 누락
            2. 보안: 인증/권한 누락(`src/proxy.ts`의 `ADMIN_API_PATHS`와 `matcher` 등록), 세션 email 없이 남의 데이터 접근,
               요청 값을 타입 확인 없이 Mongo 쿼리에 넣음(연산자 주입), 클라이언트 금액·포인트 신뢰, 시크릿·개인정보 노출
            3. 결제·주문 규칙: `withTransaction` 안에서 throw하지 않는 catch, 1인 5개 한도, 금액 계산은 `orderPolicy.ts`에서만
            4. 프로젝트 규칙: FSD import 방향, 같은 레이어 cross-slice import, inline `style={}`, 아이콘은 `pixelarticons/react`
            5. 정책 문서와 어긋나는 구현 (`docs/policies`에서 `확정`인 항목 기준)

            포맷·네이밍처럼 lint가 잡는 것, 취향 문제는 지적하지 않는다.

            ## 코멘트 방식
            - 특정 줄의 문제는 `mcp__github_inline_comment__create_inline_comment`로 인라인 코멘트.
              각 코멘트는 `[높음]`/`[중간]`/`[낮음]`으로 시작하고, 무엇이 왜 문제인지와 고치는 방법을 짧게 적는다.
            - 마지막에 `gh pr comment`로 요약 코멘트 하나: 발견한 문제 수(심각도별)와 한 줄씩 목록.
              문제가 없으면 "리뷰 결과 지적할 문제 없음"과 확인한 범위만 적는다.
            - 확실하지 않은 것은 `[확인 필요]`로 표시하고 근거가 되는 코드 줄을 든다.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
